service: vrc-video-api

custom:
  yt_api_key: ${env:API_KEY}
  contents_bucket: ${self:service}-${opt:stage}-bucket
  vrc_video_table: ${self:service}-${opt:stage}-table
  pythonRequirements:
    dockerizePip: true
    dockerImage: public.ecr.aws/sam/build-python3.13:latest
    useStaticCache: false
    useDownloadCache: false
    layer: true
  deploymentBucket:
    name: ${env:DEPLOY_BUCKET}
  cf_dmain:
    Fn::Join:
      - ""
      - - "https://"
        - Fn::GetAtt:
            - ContentsCloudFront
            - DomainName

provider:
  name: aws
  runtime: python3.13
  region: ap-northeast-1
  role: ${env:LAMBDA_IAM}
  timeout: 20
  logRetentionInDays: 14
  tracing:
    apiGateway: true
    lambda: true
  environment:
    VRC_VIDEO_TABLE: ${self:custom.vrc_video_table}
    API_KEY: ${self:custom.yt_api_key}
    CF_DOMAIN: ${self:custom.cf_dmain}
  layers:
    - { Ref: UtilsLayerLambdaLayer }
    - { Ref: PythonRequirementsLambdaLayer }

# 各関数は自身のhandler.pyのみ含める (共通処理はutilsLayer)
package:
  individually: true
  patterns:
    - "!./**"

layers:
  utilsLayer:
    path: src/layers/utils
    name: ${opt:stage}-${self:service}-utilsLayer
    description: utils
    compatibleRuntimes:
      - python3.13
    package:
      patterns:
        - "python/*.py"

functions:
  # 登録
  post_yt_channel_regist:
    handler: src/lambda/post_yt_channel_regist/handler.main
    package:
      patterns:
        - src/lambda/post_yt_channel_regist/handler.py
    events:
      - http:
          path: /video/yt/channel/regist
          method: post
          cors: true
  # チャンネルID変換(確認用)
  get_yt_ch_resolve:
    handler: src/lambda/get_yt_ch_resolve/handler.main
    package:
      patterns:
        - src/lambda/get_yt_ch_resolve/handler.py
    events:
      - http:
          path: /yt/ch/resolve
          method: get
          cors: true
  # 動画取得
  get_yt_channel:
    handler: src/lambda/get_yt_channel/handler.main
    package:
      patterns:
        - src/lambda/get_yt_channel/handler.py
    events:
      - http:
          # ?n=n
          path: /videos/yt/ch/{channel_id}
          method: get
          cors: true
      - http:
          path: /yt/ch/{channel_id}/video # 新エンドポイント
          method: get
          cors: true
  # リスト取得
  get_yt_channel_list:
    handler: src/lambda/get_yt_channel_list/handler.main
    timeout: 29
    package:
      patterns:
        - src/lambda/get_yt_channel_list/handler.py
    events:
      - http:
          path: /videos/yt/chlist/{channel_id}
          method: get
          cors: true
      - http:
          path: /yt/ch/{channel_id}/titles # 新エンドポイント
          method: get
          cors: true
  # 動画取得(プレイリスト)
  get_yt_playlist:
    handler: src/lambda/get_yt_playlist/handler.main
    package:
      patterns:
        - src/lambda/get_yt_playlist/handler.py
    events:
      - http:
          path: /yt/pl/{playlist_id}/video
          method: get
          cors: true
  # タイトルリスト取得
  get_yt_playlist_titles:
    handler: src/lambda/get_yt_playlist_titles/handler.main
    package:
      patterns:
        - src/lambda/get_yt_playlist_titles/handler.py
    events:
      - http:
          path: /yt/pl/{playlist_id}/titles
          method: get
          cors: true
  get_ytlive_channel:
    handler: src/lambda/get_ytlive_channel/handler.main
    package:
      patterns:
        - src/lambda/get_ytlive_channel/handler.py
    events:
      - http:
          path: /videos/ytlive/ch/{channel_id}
          method: get
          cors: true
  get_yt_query:
    handler: src/lambda/get_yt_query/handler.main
    package:
      patterns:
        - src/lambda/get_yt_query/handler.py
    events:
      - http:
          path: /videos/yt/query
          method: get
          cors: true
      - http:
          path: /yt/search/video # 新エンドポイント
          method: get
          cors: true
  # リスト取得
  get_yt_query_list:
    handler: src/lambda/get_yt_query_list/handler.main
    timeout: 29
    package:
      patterns:
        - src/lambda/get_yt_query_list/handler.py
    events:
      - http:
          path: /videos/yt/query/list
          method: get
          cors: true
      - http:
          path: /yt/search/titles # 新エンドポイント
          method: get
          cors: true
  get_yt_ch_all:
    handler: src/lambda/get_yt_ch_all/handler.main
    timeout: 29
    package:
      patterns:
        - src/lambda/get_yt_ch_all/handler.py
    events:
      - http:
          path: /api/yt/ch/{channel_id}/video/all
          method: get
          cors: true
  get_yt_ch_continuous_play:
    handler: src/lambda/get_yt_ch_continuous_play/handler.main
    package:
      patterns:
        - src/lambda/get_yt_ch_continuous_play/handler.py
    events:
      - http:
          path: /yt/ch/{channel_id}/continuous
          method: get
          cors: true
  get_yt_pl_continuous_play:
    handler: src/lambda/get_yt_pl_continuous_play/handler.main
    package:
      patterns:
        - src/lambda/get_yt_pl_continuous_play/handler.py
    environment:
      REGIST_LAMBDA_NAME: ${self:service}-${opt:stage}-get_yt_pl_continuous_play_regist
    events:
      - http:
          path: /yt/pl/{playlist_id}/continuous
          method: get
          cors: true
  get_yt_pl_continuous_play_regist:
    handler: src/lambda/get_yt_pl_continuous_play_regist/handler.main
    package:
      patterns:
        - src/lambda/get_yt_pl_continuous_play_regist/handler.py
    reservedConcurrency: 1
  # リスト取得 馬鹿重い
  get_yt_chs_description:
    handler: src/lambda/get_yt_chs_description/handler.main
    timeout: 29
    package:
      patterns:
        - src/lambda/get_yt_chs_description/handler.py
    events:
      - http:
          path: /videos/yt/chs/description
          method: get
          cors: true
  # スプレッドシート
  get_ss_video:
    timeout: 29
    handler: src/lambda/get_ss_video/handler.main
    package:
      patterns:
        - src/lambda/get_ss_video/handler.py
    events:
      - http:
          path: /ss/video
          method: get
          cors: true
  get_ss_video_titles:
    timeout: 29
    handler: src/lambda/get_ss_video_titles/handler.main
    package:
      patterns:
        - src/lambda/get_ss_video_titles/handler.py
    events:
      - http:
          path: /ss/titles
          method: get
          cors: true
  # YouTube API使用量(概算)をDiscordに通知
  notify_yt_quota:
    handler: src/lambda/notify_yt_quota/handler.main
    package:
      patterns:
        - src/lambda/notify_yt_quota/handler.py
    environment:
      STAGE: ${opt:stage}
      DISCORD_WEBHOOK_URL: ${env:DISCORD_WEBHOOK_URL, ''}
    events:
      - schedule: cron(0 * * * ? *) # 毎時0分 (UTC)
  # 前日のアクセス上位をDiscordに通知
  notify_access_summary:
    handler: src/lambda/notify_access_summary/handler.main
    package:
      patterns:
        - src/lambda/notify_access_summary/handler.py
    environment:
      STAGE: ${opt:stage}
      DISCORD_WEBHOOK_URL: ${env:DISCORD_WEBHOOK_URL, ''}
    events:
      - schedule: cron(0 0 * * ? *) # 毎日 0:00 UTC = 9:00 JST
resources:
  Resources:
    vrcVideoTable:
      Type: "AWS::DynamoDB::Table"
      Properties:
        TableName: ${self:custom.vrc_video_table}
        AttributeDefinitions:
          - AttributeName: user_id
            AttributeType: S
          - AttributeName: video_id
            AttributeType: S
        KeySchema:
          - AttributeName: user_id
            KeyType: HASH
          - AttributeName: video_id
            KeyType: RANGE
        ProvisionedThroughput:
          ReadCapacityUnits: 6
          WriteCapacityUnits: 4
        TimeToLiveSpecification:
          AttributeName: TTL
          Enabled: True
    # 動画設置用S3
    ContentsS3:
      Type: AWS::S3::Bucket
      DeletionPolicy: Retain
      Properties:
        AccessControl: Private
        BucketName: ${self:custom.contents_bucket}
    # ナゲットポリシー
    ContentsS3Policy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket:
          Ref: ContentsS3
        PolicyDocument:
          Statement:
            - Effect: Allow
              Principal:
                AWS:
                  Fn::Join:
                    - " "
                    - - "arn:aws:iam::cloudfront:user/CloudFront Origin Access Identity"
                      - Ref: StaticCloudFrontOriginAccessIdentity
              Action: s3:GetObject
              Resource:
                Fn::Join:
                  - "/"
                  - - Fn::GetAtt:
                        - ContentsS3
                        - Arn
                    - "*"
    # CDNのやつ
    ContentsCloudFront:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Enabled: true
          Comment: "Delivery static contents"
          DefaultRootObject: index.html
          HttpVersion: http2
          PriceClass: PriceClass_200 # 日本が含まってるやつ
          CustomErrorResponses:
            - ErrorCode: 403
              ResponseCode: 200
              ResponsePagePath: /error.mp4
            - ErrorCode: 404
              ResponseCode: 200
              ResponsePagePath: /error.mp4
          Origins:
            - Id: S3Origin
              DomainName:
                Fn::GetAtt:
                  - ContentsS3
                  - DomainName
              S3OriginConfig:
                OriginAccessIdentity:
                  Fn::Join:
                    - "/"
                    - - origin-access-identity/cloudfront
                      - Ref: StaticCloudFrontOriginAccessIdentity
          DefaultCacheBehavior:
            AllowedMethods:
              - HEAD
              - GET
            CachedMethods:
              - HEAD
              - GET
            Compress: false
            DefaultTTL: 900
            MaxTTL: 900
            MinTTL: 900
            ForwardedValues:
              QueryString: false
            SmoothStreaming: false
            TargetOriginId: S3Origin
            ViewerProtocolPolicy: https-only
    # OAI
    StaticCloudFrontOriginAccessIdentity:
      Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
      Properties:
        CloudFrontOriginAccessIdentityConfig:
          Comment:
            Ref: AWS::StackName
  Outputs:
    ContentsCloudFrontUrl:
      Value:
        Fn::Join:
          - ""
          - - "https://"
            - Fn::GetAtt:
                - ContentsCloudFront
                - DomainName
